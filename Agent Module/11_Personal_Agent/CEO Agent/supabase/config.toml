project_id = "ceo-intelligence-agent"

[api]
enabled = true
schemas = ["public", "ceo"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"
